name: Desktop clients

# Builds the Qt desktop apps natively on Linux, Windows and macOS (Qt cannot be cross-compiled
# for these from one machine). Run it manually to get downloadable artifacts, or push a tag like
# "desktop-v0.1.0" to also publish them as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['apps/desktop-client/**', '.github/workflows/desktop-release.yml']

permissions:
  contents: read

env:
  QT_VERSION: '6.7.3'
  DESKTOP_DIR: apps/desktop-client

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04,  arch: linux_gcc_64 }
          - { name: windows, os: windows-2022,  arch: win64_msvc2019_64 }
          - { name: macos,   os: macos-14,      arch: clang_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.arch }}
          cache: true

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: macOS tools
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Windows compiler environment
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Windows tools
        if: matrix.name == 'windows'
        run: choco install ninja -y

      - name: Configure
        run: cmake -S ${{ env.DESKTOP_DIR }} -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          ${{ env.DESKTOP_DIR }}/packaging/package-linux.sh build dist
          # Smoke test: the packaged apps must start without a display server.
          mkdir smoke && tar -xzf dist/amcp-desktop-linux-x86_64.tar.gz -C smoke
          for app in admin user; do
            QT_QPA_PLATFORM=offscreen timeout 5 smoke/amcp-desktop-linux-x86_64/amcp-$app-desktop || [ $? -eq 124 ]
          done

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $out = "dist/amcp-desktop-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($app in 'admin','user') {
            $dir = "$out/amcp-$app-desktop"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "build/amcp-$app-desktop/amcp_${app}_desktop.exe" $dir
            windeployqt --release --no-translations "$dir/amcp_${app}_desktop.exe"
            Copy-Item "${{ env.DESKTOP_DIR }}/packaging/amcp.env" "$dir/.env"
          }
          Compress-Archive -Path $out -DestinationPath dist/amcp-desktop-windows-x64.zip

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p dist
          for app in admin user; do
            bundle="build/amcp-$app-desktop/amcp_${app}_desktop.app"
            macdeployqt "$bundle"
            cp "${{ env.DESKTOP_DIR }}/packaging/amcp.env" "$bundle/Contents/MacOS/.env"
            ditto -c -k --keepParent "$bundle" "dist/amcp-$app-desktop-macos-arm64.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
