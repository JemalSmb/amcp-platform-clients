<section class="w-full space-y-6">
	<h2 class="text-3xl font-bold domain-heading">Policies</h2>

	<div class="domain-coming-soon" *ngIf="domainService.currentMeta().comingSoon">
		<p class="text-lg font-semibold">{{ domainService.currentMeta().label }} is coming soon</p>
		<p class="text-sm">No policies are configured for this domain yet.</p>
	</div>

	<div class="overflow-x-auto" *ngIf="!domainService.currentMeta().comingSoon">
		<table class="table">
			<thead>
				<tr>
					<th>Name</th>
					<th>Domain</th>
					<th>Type</th>
					<th>Enforcement</th>
					<th>Updated</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let policy of policies">
					<td>{{ policy.name }}</td>
					<td>{{ policy.domain }}</td>
					<td>{{ policy.type }}</td>
					<td>
						<span
							class="badge"
							[class.badge-success]="policy.enforcement === 'enforced'"
							[class.badge-warning]="policy.enforcement === 'monitor'"
							[class.badge-ghost]="policy.enforcement === 'disabled'"
						>{{ policy.enforcement }}</span>
					</td>
					<td>{{ policy.updatedAt | date:'short' }}</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
