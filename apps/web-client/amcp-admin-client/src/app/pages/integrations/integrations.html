<section class="w-full space-y-6">
	<h2 class="text-3xl font-bold domain-heading">Integrations</h2>

	<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
		<div class="card bg-base-200" *ngFor="let integration of integrations">
			<div class="card-body">
				<div class="flex items-center justify-between">
					<h3 class="card-title">{{ integration.name }}</h3>
					<span
						class="badge"
						[class.badge-success]="integration.status === 'connected'"
						[class.badge-error]="integration.status === 'error'"
						[class.badge-ghost]="integration.status === 'disconnected'"
					>{{ integration.status }}</span>
				</div>
				<p class="text-xs text-base-content/60">{{ integration.type }}</p>
				<p class="text-xs text-base-content/60">Last sync {{ integration.lastSyncAt | date:'short' }}</p>
			</div>
		</div>
	</div>
</section>
