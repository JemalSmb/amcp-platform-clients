<section class="w-full space-y-6">
	<div class="flex items-center justify-between">
		<h2 class="text-3xl font-bold domain-heading">Users</h2>
		<button class="btn btn-primary btn-sm" (click)="openForm()">Add user</button>
	</div>

	<form *ngIf="showForm" class="card bg-base-200 p-4 space-y-3 max-w-md" (ngSubmit)="createUser()" #userForm="ngForm">
		<input class="input input-bordered w-full" name="name" placeholder="Full name" required [(ngModel)]="form.name" />
		<input class="input input-bordered w-full" name="email" type="email" placeholder="Email" required [(ngModel)]="form.email" />
		<input class="input input-bordered w-full" name="password" type="password" placeholder="Temporary password (min 8)" minlength="8" required [(ngModel)]="form.password" />
		<select class="select select-bordered w-full capitalize" name="role" [(ngModel)]="form.role">
			<option *ngFor="let r of roles" [value]="r">{{ r }}</option>
		</select>
		<p *ngIf="error" class="text-error text-sm" role="alert">{{ error }}</p>
		<div class="flex gap-2">
			<button class="btn btn-primary btn-sm" type="submit" [disabled]="userForm.invalid || saving">Create user</button>
			<button class="btn btn-ghost btn-sm" type="button" (click)="showForm = false">Cancel</button>
		</div>
	</form>

	<div class="overflow-x-auto">
		<table class="table">
			<thead>
				<tr>
					<th>Name</th>
					<th>Email</th>
					<th>Role</th>
					<th>Client</th>
					<th>Last login</th>
					<th>Status</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let user of users">
					<td>{{ user.name }}</td>
					<td>{{ user.email }}</td>
					<td class="capitalize">{{ user.role }}</td>
					<td><span class="badge badge-outline">{{ user.client === 'app' ? 'App user' : 'Web user' }}</span></td>
					<td>{{ user.lastLoginAt ? (user.lastLoginAt | date:'short') : '—' }}</td>
					<td>
						<span
							class="badge"
							[class.badge-success]="user.status === 'active'"
							[class.badge-warning]="user.status === 'invited'"
							[class.badge-error]="user.status === 'suspended'"
						>{{ user.status }}</span>
					</td>
					<td>
						<button class="btn btn-sm" (click)="toggleSuspend(user)">
							{{ user.status === 'suspended' ? 'Reinstate' : 'Suspend' }}
						</button>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
