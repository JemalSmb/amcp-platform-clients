<section class="w-full space-y-6">
	<h2 class="text-3xl font-bold domain-heading">Reports</h2>

	<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
		<div class="card bg-base-200" *ngFor="let report of reports">
			<div class="card-body">
				<h3 class="card-title text-lg">{{ report.title }}</h3>
				<p class="text-xs text-base-content/60">{{ report.domain }} · {{ report.period }}</p>
				<p class="text-xs text-base-content/60">Generated {{ report.generatedAt | date:'short' }}</p>
			</div>
		</div>
	</div>
</section>
