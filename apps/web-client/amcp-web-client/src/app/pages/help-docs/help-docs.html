<section class="w-full space-y-6">
	<h2 class="text-3xl font-bold domain-heading">Help Docs</h2>
	<p class="text-sm opacity-70">Reference guides are served by the platform API.</p>

	<p class="text-sm text-error" *ngIf="error">{{ error }}</p>

	<div class="card bg-base-100 border" *ngIf="openDoc">
		<div class="card-body">
			<div class="flex items-center justify-between">
				<h3 class="card-title">{{ openDoc.title }}</h3>
				<button class="btn btn-sm btn-ghost" (click)="close()">Close</button>
			</div>
			<pre class="whitespace-pre-wrap text-sm">{{ openDoc.content }}</pre>
		</div>
	</div>

	<div class="space-y-4">
		<div class="card bg-base-200" *ngFor="let doc of docs">
			<div class="card-body">
				<div class="flex items-center gap-2">
					<span class="badge badge-ghost w-fit">{{ doc.category }}</span>
					<span class="badge badge-outline w-fit">{{ doc.source }}</span>
				</div>
				<h3 class="card-title text-lg">{{ doc.title }}</h3>
				<p class="text-sm text-gray-500">{{ doc.summary }}</p>
				<div class="card-actions justify-end">
					<button class="btn btn-sm btn-primary" (click)="open(doc)" [disabled]="loadingId === doc.id">Open doc</button>
				</div>
			</div>
		</div>
	</div>
</section>
