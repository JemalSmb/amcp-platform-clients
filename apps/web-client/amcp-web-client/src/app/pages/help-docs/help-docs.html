<section class="w-full space-y-6">
	<h2 class="text-3xl font-bold domain-heading">Help Docs</h2>
	<p class="text-sm text-base-content/70">Reference guides are served by the platform API.</p>

	<p class="text-sm text-error" *ngIf="error">{{ error }}</p>

	<div class="space-y-4">
		<div class="card bg-base-200" *ngFor="let doc of docs">
			<div class="card-body">
				<div class="flex items-center gap-2">
					<span class="badge badge-ghost w-fit">{{ doc.category }}</span>
					<span class="badge badge-outline w-fit">{{ doc.source }}</span>
				</div>
				<h3 class="card-title text-lg">{{ doc.title }}</h3>
				<p class="text-sm text-base-content/60">{{ doc.summary }}</p>
				<div class="card-actions justify-end">
					<button class="btn btn-sm btn-primary" (click)="toggle(doc)" [disabled]="loadingId === doc.id" [attr.aria-expanded]="openDoc?.id === doc.id">
						<span class="loading loading-spinner loading-xs" *ngIf="loadingId === doc.id"></span>
						{{ openDoc?.id === doc.id ? 'Close doc' : 'Open doc' }}
					</button>
				</div>
				<article class="mt-2 rounded-box bg-base-100 p-4" *ngIf="openDoc?.id === doc.id">
					<pre class="whitespace-pre-wrap text-sm">{{ openDoc?.content }}</pre>
				</article>
			</div>
		</div>
	</div>
</section>
